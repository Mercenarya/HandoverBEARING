acquisition_period_s: 10.0
build_official: true
clock_repair: bracketed_nominal_interval
clock_repair_tolerance_s: 0.001
dataset_source:
  archive_url: https://codeload.github.com/Lucky-Loek/ieee-phm-2012-data-challenge-dataset/zip/refs/heads/master
  commit_sha: 129d43e0aa71e1da992bb4c0f69d54fd990c58cf
  dataset_version: PHM2012 snapshot 129d43e0
  expected_archive_sha256: 558876e6ea76a803265a744a94e67f67cad7a1ea2c799e6ec42665187e6789d1
  pin_policy: content SHA-256 AND GitHub ZIP commit comment; refuse changed master
    content
  repository_url: https://github.com/Lucky-Loek/ieee-phm-2012-data-challenge-dataset
execution_mode: clean_rebuild
expected_acc_samples: 2560
expected_learning_terminal_indices:
  Bearing1_1: 2803
  Bearing1_2: 871
  Bearing2_1: 911
  Bearing2_2: 797
  Bearing3_1: 515
  Bearing3_2: 1637
folds: all
handcrafted_features:
  bearing_geometry:
    contact_angle_deg: 0.0
    pitch_diameter_mm: 25.6
    rolling_element_count: 13
    rolling_element_diameter_mm: 3.5
    source: IEEE PHM 2012 Challenge Details Appendix A.1; contact angle is an explicit
      engineering assumption because the source does not state it
  channel_names:
  - horizontal
  - vertical
  condition_speed_rpm:
    OC1: 1800
    OC2: 1650
    OC3: 1500
  fault_band_half_width_hz: 10.0
  harmonics:
  - 1
  - 2
  - 3
  spectral_kurtosis_segment_length: 256
  temperature_history_step_s: 1.0
inventory_workers: 8
max_files: null
max_window_gap_s: 15.0
output_root: artifacts/pronostia_cache
pipeline_version: pronostia-notebook-v2
raw_root: data/raw/pronostia
rul_cycles_definition: remaining_10_second_acquisition_intervals
scaler_epsilon: 1.0e-06
seed: 42
sequence_length: 32
stride_eval: 16
stride_train: 16
temperature:
  alignment_method: causal_nearest_predecessor
  allow_future: false
  fraction_scale: 10
  history_horizon_s: 63.0
  max_alignment_gap_s: 1.0
  missing_policy:
    cross_bearing_imputation: forbidden
    exported_masks:
    - temperature_mask
    - handcrafted_feature_mask
    fill_interpretation: training_mean_after_zscore
    fully_missing_bearing: preserve_full_mask
    future_value_imputation: forbidden
    partial_history: preserve_per_element_mask
    standardized_fill_value: 0.0
  physical_bounds_c: null
  representation: temp_history_64
test_rul_at_cut_seconds:
  Bearing1_3: 5730
  Bearing1_4: 339
  Bearing1_5: 1610
  Bearing1_6: 1460
  Bearing1_7: 7570
  Bearing2_3: 7530
  Bearing2_4: 1390
  Bearing2_5: 3090
  Bearing2_6: 1290
  Bearing2_7: 580
  Bearing3_3: 820
test_rul_source: https://www.mdpi.com/2076-3417/8/7/1102
test_rul_source_locator: Table 2, DOI 10.3390/app8071102; secondary published benchmark
  table, not organizer answer-key
vibration:
  bandpass_hz:
  - 100
  - 10000
  effective_sampling_rate_hz: 10240
  filter_order: 4
  mode: resample_1024
  resampling_method: scipy.signal.resample_poly_2_5
  sampling_rate_hz: 25600
